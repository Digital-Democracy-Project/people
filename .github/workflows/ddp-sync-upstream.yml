name: DDP sync upstream
on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC: well before the 03:00 ddp-sync pull and the 04:00 roster step
  workflow_dispatch: {}
concurrency: ddp-sync-upstream
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DDP_SYNC_TOKEN }}   # repo-scoped PAT (PLAN-fork-management.md 8.6); the built-in token cannot push workflow-file changes
      - name: Merge upstream main
        id: merge
        run: |
          git config user.name  "ddp-upstream-sync"
          git config user.email "agents@digitaldemocracyproject.org"
          git remote add upstream https://github.com/openstates/people.git
          git fetch --quiet upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"   # recorded because a merge can fast-forward and then HEAD^1 is the wrong base
          if ! git merge --no-edit upstream/main; then
            git merge --abort; echo "merge conflict"; exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Upstream's own lint-yaml.yml (uv, as of 2026-10) is the reference for the commands below; they run on the
      # merged tree, so they use whatever toolchain the merge just brought in.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1, same pin as upstream
        if: steps.merge.outputs.changed == 'true'
      - name: Validate what the merge brought in (the checks upstream CI and our PR gate run)
        if: steps.merge.outputs.changed == 'true'
        env:
          BEFORE: ${{ steps.merge.outputs.before }}
          OS_PEOPLE_DIRECTORY: ${{ github.workspace }}
        run: |
          uvx yamllint==1.38.0 -s .
          uv sync
          changed=$(git diff --name-only --diff-filter=d "$BEFORE" HEAD)   # everything the merge imported, fast-forward or not
          if printf '%s\n' "$changed" | grep -qx settings.yml; then
            uv run os-people lint
          else
            people=$(printf '%s\n' "$changed" | sed -En 's#^data/([a-z]{2})/(legislature|retired|executive|municipalities)/.*#\1#p' | sort -u)
            [ -z "$people" ] || uv run os-people lint $people
            committees=$(printf '%s\n' "$changed" | sed -En 's#^data/([a-z]{2})/committees/.*#\1#p' | sort -u)
            [ -z "$committees" ] || uv run os-committees lint $committees
          fi
          uv run python .github/scripts/check_duplicate_people.py --changed-files $changed --base-ref "$BEFORE"
      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main
      - name: Tell us
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":red_circle: *people upstream sync failed* - $url\"}" "$SLACK_WEBHOOK_URL" || true
